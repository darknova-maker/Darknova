<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DarkNova AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b24">
<title>DarkNova AI</title>
<style>
:root{--bg:#0d0b24;--panel:#171438;--line:#2b2760;--text:#ece9ff;--mute:#8f8ac4;--nova:#ff5fa8;--glow:#7c5cff;--me:#2a2570}
*{box-sizing:border-box}
html{background:#0d0b24;height:100%}
body{margin:0;height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#241a66 0,var(--bg) 60%);color:var(--text);font:16px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--nova) 30%,var(--glow) 65%,#1a1450 100%);box-shadow:0 0 22px var(--glow)}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
header small{display:block;color:var(--mute);font-size:12px}
header button{margin-left:auto}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--nova);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--me);border-bottom-right-radius:6px}
.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
#setup{margin:auto;text-align:center;max-width:340px}
#setup .logo{width:84px;height:84px;margin:0 auto 18px;box-shadow:0 0 50px var(--glow)}
#setup h2{margin:0 0 8px;font-size:24px}
#setup p{color:var(--mute);margin:0 0 20px}
.go{background:linear-gradient(135deg,var(--glow),var(--nova));border:0;color:#fff;font-weight:600;padding:13px 26px;font-size:17px}
#bar{height:6px;background:var(--panel);border-radius:6px;margin-top:18px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--nova))}
#st{color:var(--mute);font-size:13px;margin-top:10px;min-height:20px}
form{display:none;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:rgba(13,11,36,.9)}
textarea{flex:1;resize:none;max-height:140px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font:inherit}
form .go{padding:10px 18px;font-size:16px}
#note{display:none;padding:6px 14px;font-size:13px;color:var(--mute);align-items:center;gap:10px}#note img{height:38px;border-radius:8px}.m img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}#cam{padding:8px 12px;font-size:18px}
#start{display:none!important}
#tabs{display:none;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
#tabs button{flex:1}#tabs .on{background:linear-gradient(135deg,var(--glow),var(--nova));border:0;color:#fff;font-weight:600}
#tr{display:none;flex:1;flex-direction:column;gap:10px;padding:16px;overflow-y:auto}
#tr select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
#tr textarea{flex:none;min-height:110px;resize:vertical}
#trout{min-height:110px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap}
#mic,#spk,#cam{padding:8px 10px;font-size:17px}#mic.on{background:linear-gradient(135deg,var(--glow),var(--nova));border:0}textarea{min-width:0}
#tabs button{padding:8px 4px;font-size:14px}
#nc{display:none;flex:1;flex-direction:column;gap:10px;padding:16px;overflow-y:auto}
#nc textarea{flex:none;min-height:90px;resize:vertical}
#ncchips{display:flex;flex-wrap:wrap;gap:6px}#ncchips button{font-size:13px;padding:6px 10px}
#ncout{display:none;margin:0;max-height:260px;overflow:auto;background:#0a0820;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#ncbtns{display:none;gap:8px}#ncbtns button{flex:1}
#ncframe{display:none;width:100%;height:440px;border:1px solid var(--line);border-radius:12px;background:#fff;flex:none}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div><h1>DarkNova AI</h1><small>Creada por Saúl Arce · funciona en tu iPhone</small></div>
  <button id="clear" type="button" hidden>Nuevo chat</button>
</header>
<div id="tabs"><button type="button" id="tabc" class="on">💬 Chat</button><button type="button" id="tabt">🌐 Traductor</button><button type="button" id="tabn">💻 Nova-Code</button></div>

<div id="chat">
  <div id="setup">
    <div class="logo"></div>
    <h2>Soy DarkNova AI</h2>
    <p>Creada por Saúl Arce. Cargando… La primera vez descargo mi modelo (unos 700 MB): usa Wi-Fi y no cierres la app. Después entro en pocos segundos.</p>
    <button class="go" id="start" type="button">Reintentar</button>
    <div id="bar"><i></i></div>
    <div id="st"></div>
  </div>
</div>

<div id="tr">
  <label for="trlang">Traducir a:</label>
  <select id="trlang"><option>español</option><option>inglés</option><option>francés</option><option>alemán</option><option>italiano</option><option>portugués</option><option>catalán</option><option>árabe</option><option>chino</option><option>japonés</option></select>
  <textarea id="trin" placeholder="Escribe o pega el texto (detecto el idioma solo)"></textarea>
  <button class="go" id="trgo" type="button">Traducir</button>
  <div id="trout" aria-live="polite"></div>
  <button id="trcopy" type="button">Copiar traducción</button>
</div>
<div id="nc">
  <strong>💻 Nova-Code</strong>
  <textarea id="ncin" placeholder="Dime qué juego o app quieres. Ej: un juego de la serpiente con puntuación"></textarea>
  <div id="ncchips"><button type="button">Juego de la serpiente</button><button type="button">Calculadora</button><button type="button">Lista de tareas</button><button type="button">Juego de memoria con cartas</button></div>
  <button class="go" id="ncgo" type="button">Crear código</button>
  <pre id="ncout"></pre>
  <div id="ncbtns"><button type="button" id="nccopy">Copiar código</button><button type="button" id="ncrun">▶ Probar</button></div>
  <iframe id="ncframe" sandbox="allow-scripts" title="Vista previa"></iframe>
</div>
<div id="note"></div>
<form id="f">
  <button type="button" id="cam" aria-label="Enviar foto">📷</button><input type="file" id="file" accept="image/*" hidden><button type="button" id="mic" aria-label="Hablar con DarkNova">🎤</button><button type="button" id="spk" aria-label="Leer respuestas en voz alta">🔇</button>
  <textarea id="q" rows="1" placeholder="Escribe a DarkNova AI…"></textarea>
  <button class="go" id="send" type="submit">Enviar</button>
</form>

<script type="module">
const LIBS = ["https://esm.run/@mlc-ai/web-llm", "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm"];
async function loadLib() {
  let last;
  for (const u of LIBS) { try { return await import(u); } catch (e) { last = e; } }
  throw last;
}

const MODEL = (() => { try { return localStorage.getItem("dn-model"); } catch (e) { return null; } })() || "Llama-3.2-1B-Instruct-q4f32_1-MLC";
const SYSTEM = "Eres DarkNova AI, una inteligencia artificial creada por Saúl Arce. Cuando te presentes o te pregunten quién eres, di siempre que eres DarkNova AI y que fuiste creada por Saúl Arce. No inventes nada sobre Saúl Arce: solo sabes que es quien te creó. Habla de ti siempre en femenino. Eres simpática, alegre y cercana: tono amable y positivo, con algún emoji de vez en cuando. Responde en el idioma del usuario, con un español correcto y natural, sin inventar palabras. Si no estás segura de algo, dilo en lugar de inventar. Si recibes información de Wikipedia, úsala como base de tu respuesta. Sabes traducir palabras y frases entre idiomas: da primero la traducción y, si hace falta, una nota muy breve. Sé breve y directa: normalmente 1 a 3 frases, y solo te extiendes si te lo piden.";
const $ = id => document.getElementById(id);
const chat = $("chat"), f = $("f"), q = $("q"), st = $("st"), bar = $("bar");
let engine, webllm, history = [], busy = false;
const VISION = "Phi-3.5-vision-instruct-q4f32_1-MLC";
let cur = MODEL;
const mk = cb => webllm.CreateMLCEngine(cur, { initProgressCallback: cb }, { context_window_size: cur === VISION ? 4096 : 2048 });
const save = () => { try { localStorage.setItem("dn-history", JSON.stringify(history.slice(-60))); } catch (e) {} };

// Icono para la pantalla de inicio
try {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const x = c.getContext("2d");
  x.fillStyle = "#0d0b24"; x.fillRect(0, 0, 180, 180);
  const g = x.createRadialGradient(70, 70, 4, 90, 90, 62);
  g.addColorStop(0, "#fff"); g.addColorStop(.3, "#ff5fa8"); g.addColorStop(.7, "#7c5cff"); g.addColorStop(1, "#1a1450");
  x.fillStyle = g; x.beginPath(); x.arc(90, 90, 62, 0, 7); x.fill();
  const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL(); document.head.appendChild(l);
} catch (e) {}

function add(text, cls, pic) {
  const d = document.createElement("div"); d.className = "m " + cls;
  if (pic) { const im = document.createElement("img"); im.src = pic; d.appendChild(im); }
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

function showChat() {
  $("setup").remove(); f.style.display = "flex"; $("clear").hidden = false; $("tabs").style.display = "flex";
  try { history = JSON.parse(localStorage.getItem("dn-history") || "[]"); } catch (e) { history = []; }
  if (history.length && history[history.length - 1].role === "user") { const l = history.pop(); save(); q.value = l.content.replace(/^📷 /, ""); }
  try { const d = localStorage.getItem("dn-draft"); if (d) { q.value = d; localStorage.removeItem("dn-draft"); } } catch (e) {}
  if (!history.length) add("Hola, soy DarkNova AI, creada por Saúl Arce. ¿En qué te ayudo?", "a");
  history.forEach(m => add(m.content, m.role === "user" ? "u" : "a"));
}

let tries = 0;
const retryLater = () => { if (++tries <= 3) setTimeout(startApp, 5000); else st.textContent += " Cierra la app y ábrela otra vez."; };
function failReload() {
  try {
    const now = Date.now(), n = JSON.parse(localStorage.getItem("dn-fails") || "[]").filter(x => now - x < 180000); n.push(now);
    localStorage.setItem("dn-fails", JSON.stringify(n));
    if (n.length >= 3 && !localStorage.getItem("dn-model")) { localStorage.setItem("dn-model", "Qwen2.5-0.5B-Instruct-q4f32_1-MLC"); localStorage.setItem("dn-fails", "[]"); }
  } catch (e) {}
  setTimeout(() => location.reload(), 1500);
}
const startApp = async () => {
  $("start").disabled = true; bar.style.display = "block";
  st.textContent = "Iniciando…";
  if (!location.protocol.startsWith("http")) {
    st.textContent = "Abre DarkNova desde su enlace de Netlify o GitHub en Safari, no desde el archivo suelto.";
    return;
  }
  if (!navigator.gpu) {
    st.textContent = "Tu iPhone necesita iOS 26 o superior (Safari con WebGPU). Activa WebGPU en Ajustes > Apps > Safari > Avanzado > Funciones.";
    return;
  }
  try {
    st.textContent = "Cargando motor de IA…";
    webllm = await loadLib();
    engine = await mk(p => { bar.firstElementChild.style.width = Math.round(p.progress * 100) + "%"; st.textContent = p.text; });
    try { localStorage.setItem("dn-ready", "1"); } catch (e) {}
    showChat();
  } catch (e) {
    st.textContent = "No se pudo cargar el modelo: " + (e.message || e);
    retryLater();
  }
};
$("start").onclick = startApp;
$("start").style.display = "none"; startApp();

let img = null;
const note = $("note");
function preview() {
  note.style.display = "flex"; note.innerHTML = "";
  const im = document.createElement("img"); im.src = img;
  const sp = document.createElement("span"); sp.textContent = "Foto lista";
  const x = document.createElement("button"); x.type = "button"; x.textContent = "Quitar";
  x.onclick = () => { img = null; note.style.display = "none"; };
  note.append(im, sp, x);
}
function shrink(file) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 672 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", .85));
    };
    im.onerror = no; im.src = u;
  });
}
$("cam").onclick = () => { if (!busy && engine) $("file").click(); };
$("file").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file || busy) return;
  try { img = await shrink(file); } catch (err) { note.style.display = "flex"; note.textContent = "No pude leer la foto."; return; }
  if (cur === VISION) { preview(); return; }
  if (!confirm("Para ver fotos, DarkNova descarga un modelo extra de unos 4 GB (solo la primera vez). Puede fallar en iPhones con poca memoria. ¿Continuar?")) { img = null; return; }
  busy = true; note.style.display = "flex"; note.textContent = "Descargando modelo de fotos…";
  try { await engine.unload(); } catch (e2) {}
  try {
    cur = VISION;
    engine = await mk(p => { note.textContent = "Modelo de fotos: " + Math.round(p.progress * 100) + "%"; });
    preview();
  } catch (err) {
    img = null; cur = MODEL;
    note.textContent = "No se pudo cargar el modelo de fotos (poca memoria). Vuelvo al modo texto…";
    try { engine = await mk(() => {}); note.textContent = "No se pudo cargar el modelo de fotos (poca memoria). Sigues en modo texto."; } catch (e3) { note.textContent = "Cierra la app y ábrela otra vez."; }
  }
  busy = false;
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, speak = false;
try { speak = localStorage.getItem("dn-speak") === "1"; } catch (e) {}
const flash = m => { note.style.display = "flex"; note.textContent = m; setTimeout(() => { if (!img) note.style.display = "none"; }, 5000); };
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "es-ES"; speechSynthesis.speak(u); } catch (e) {} }
const paintSpk = () => { $("spk").textContent = speak ? "🔊" : "🔇"; }; paintSpk();
$("spk").onclick = () => {
  speak = !speak; try { localStorage.setItem("dn-speak", speak ? "1" : "0"); } catch (e) {}
  paintSpk();
  if (speak) { say("Hola, soy DarkNova AI. Ahora te leeré mis respuestas."); flash("Voz activada: leeré mis respuestas en voz alta."); }
  else { try { speechSynthesis.cancel(); } catch (e) {} flash("Voz desactivada."); }
};
$("mic").onclick = () => {
  if (!SR) { flash("Este navegador no permite dictado aquí. Usa el micrófono del teclado del iPhone."); return; }
  if (rec) { rec.stop(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  rec = new SR(); rec.lang = "es-ES"; rec.interimResults = true; rec.continuous = false;
  let fin = "";
  rec.onresult = ev => { let t = ""; for (const r of ev.results) t += r[0].transcript; q.value = t; fin = t; };
  rec.onerror = ev => flash("No pude usar el micrófono (" + ev.error + "). Revisa el permiso en Ajustes, Apps, Safari, Micrófono.");
  rec.onend = () => { $("mic").classList.remove("on"); rec = null; if (fin.trim()) f.requestSubmit(); };
  try { $("mic").classList.add("on"); rec.start(); } catch (e) { $("mic").classList.remove("on"); rec = null; }
};

function showTab(t) {
  $("chat").style.display = t === "c" ? "flex" : "none"; f.style.display = t === "c" ? "flex" : "none";
  $("tr").style.display = t === "t" ? "flex" : "none"; $("nc").style.display = t === "n" ? "flex" : "none";
  if (t !== "c") $("note").style.display = "none";
  $("tabc").classList.toggle("on", t === "c"); $("tabt").classList.toggle("on", t === "t"); $("tabn").classList.toggle("on", t === "n");
}
$("tabc").onclick = () => showTab("c"); $("tabt").onclick = () => showTab("t"); $("tabn").onclick = () => showTab("n");
$("trcopy").onclick = () => { try { navigator.clipboard.writeText($("trout").textContent); $("trcopy").textContent = "¡Copiado!"; setTimeout(() => $("trcopy").textContent = "Copiar traducción", 1500); } catch (e) {} };
$("trgo").onclick = async () => {
  const t = $("trin").value.trim(); if (!t || busy || !engine) return;
  busy = true; const o = $("trout"); o.textContent = "…";
  const go = async () => {
    const r = await engine.chat.completions.create({ messages: [{ role: "system", content: "Eres un traductor profesional. Traduce el texto del usuario a " + $("trlang").value + ". Responde SOLO con la traducción, sin explicaciones, sin comillas y sin añadir nada." }, { role: "user", content: t }], stream: true, temperature: 0.1, max_tokens: 700 });
    let acc = ""; for await (const ch of r) { acc += ch.choices[0]?.delta?.content || ""; o.textContent = acc; }
  };
  try { try { await go(); } catch (e1) { o.textContent = "Reiniciando el motor…"; try { await engine.unload(); } catch (e) {} engine = await mk(() => {}); await go(); } }
  catch (e2) { o.textContent = "El iPhone pausó la IA. Reiniciando la app…"; failReload(); }
  busy = false;
};

const CODE_SYS = "Eres Nova-Code, la programadora de DarkNova AI. Crea lo que pida el usuario como UN SOLO archivo HTML con <style> y <script> dentro, para un iPhone (táctil, sin librerías ni imágenes externas). IMPORTANTE: el programa debe ser MUY corto y simple, máximo 50 líneas en total, sin comentarios, y debe terminar con <\/script></body></html>. Responde SOLO con el código en un bloque ```html, sin explicaciones.";
let ncCode = "";
document.querySelectorAll("#ncchips button").forEach(b => { b.onclick = () => { $("ncin").value = b.textContent; }; });
$("nccopy").onclick = () => { try { navigator.clipboard.writeText(ncCode); $("nccopy").textContent = "¡Copiado!"; setTimeout(() => $("nccopy").textContent = "Copiar código", 1500); } catch (e) {} };
function closeCode(c) {
  let o = c;
  if ((o.match(/<script\b/gi) || []).length > (o.match(/<\/script>/gi) || []).length) o += "\n<\/script>";
  if (!/<\/body>/i.test(o)) o += "\n</body>";
  if (!/<\/html>/i.test(o)) o += "\n</html>";
  return o;
}
const GUARD = '<script>window.onerror=function(m,s,l){var p=document.createElement("pre");p.style.cssText="color:#c00;font:12px monospace;white-space:pre-wrap;padding:8px";p.textContent="Error en el código: "+m+" (línea "+l+"). Prueba a pulsar Crear código otra vez o pide algo más sencillo.";document.body.appendChild(p)}<\/script>';
$("ncrun").onclick = () => { const fr = $("ncframe"); fr.style.display = "block"; fr.srcdoc = GUARD + closeCode(ncCode); fr.scrollIntoView({ behavior: "smooth" }); };
$("ncgo").onclick = async () => {
  const t = $("ncin").value.trim(); if (!t || busy || !engine) return;
  busy = true; ncCode = ""; const o = $("ncout"); o.style.display = "block"; o.textContent = "Creando código…";
  $("ncbtns").style.display = "none"; $("ncframe").style.display = "none";
  let acc = "", cut = false;
  const go = async () => {
    acc = ""; cut = false;
    const r = await engine.chat.completions.create({ messages: [{ role: "system", content: CODE_SYS }, { role: "user", content: t }], stream: true, temperature: 0.2, max_tokens: 1600 });
    for await (const ch of r) { acc += ch.choices[0]?.delta?.content || ""; if (ch.choices[0]?.finish_reason === "length") cut = true; o.textContent = acc; o.scrollTop = o.scrollHeight; }
  };
  try {
    try { await go(); } catch (e1) { o.textContent = "Reiniciando el motor…"; try { await engine.unload(); } catch (e) {} engine = await mk(() => {}); await go(); }
    const m = acc.match(/```(?:html)?\s*\n([\s\S]*?)(?:```|$)/);
    ncCode = (m ? m[1] : acc).trim();
    o.textContent = ncCode + (cut ? "\n\n<!-- El código se cortó por el límite del modelo. Pídeme algo más sencillo. -->" : "");
    $("ncbtns").style.display = "flex";
  } catch (e2) { o.textContent = "El iPhone pausó la IA. Reiniciando la app…"; failReload(); }
  busy = false;
};

async function lookup(t) {
  if (!navigator.onLine || t.length < 8) return "";
  if (/traduc|c[oó]mo se dice|how do you say/i.test(t)) return "";
  if (!/[?¿]|^(qu[eé]|qui[eé]n|cu[aá]l|cu[aá]ndo|d[oó]nde|c[oó]mo|cu[aá]nt)/i.test(t)) return "";
  const term = t.replace(/[¿?¡!]/g, "").replace(/^(qu[eé]|qui[eé]nes?|cu[aá]les?|cu[aá]ndo|d[oó]nde|c[oó]mo|cu[aá]nt[oa]s?)\s+(es|son|fue|fueron|era|significa|est[aá]|hay)?\s*(un[ao]?s?|el|la|los|las)?\s*/i, "").trim();
  try {
    const ctrl = new AbortController(), id = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch("https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exchars=800&gsrsearch=" + encodeURIComponent(term), { signal: ctrl.signal });
    clearTimeout(id);
    const j = await r.json(), p = Object.values(j.query?.pages || {})[0];
    return p ? p.title + ": " + p.extract : "";
  } catch (e) { return ""; }
}

f.onsubmit = async e => {
  e.preventDefault();
  const t = q.value.trim(); if ((!t && !img) || busy || !engine) return;
  busy = true; q.value = ""; const pic = img; img = null; note.style.display = "none";
  const shown = t || "Mira esta foto";
  add(shown, "u", pic);
  history.push({ role: "user", content: (pic ? "📷 " : "") + shown }); save();
  const out = add("…", "a"); let acc = "";
  const ctx = pic ? "" : await lookup(t);
  const ask = async () => {
    acc = "";
    const msgs = history.slice(-20).map(m => ({ role: m.role, content: m.content }));
    if (pic) msgs[msgs.length - 1] = { role: "user", content: [{ type: "text", text: t || "Describe esta foto." }, { type: "image_url", image_url: { url: pic } }] };
    const s = await engine.chat.completions.create({ messages: [{ role: "system", content: SYSTEM + (ctx ? "\n\nInformación de Wikipedia (úsala si es relevante):\n" + ctx : "") }, ...msgs], stream: true, temperature: 0.4, max_tokens: 400 });
    for await (const ch of s) {
      acc += ch.choices[0]?.delta?.content || ""; out.textContent = acc; chat.scrollTop = chat.scrollHeight;
    }
  };
  try {
    try { await ask(); }
    catch (e1) {
      out.textContent = "Reiniciando el motor, un momento…";
      try { await engine.unload(); } catch (e) {}
      engine = await mk(() => {});
      out.textContent = "…";
      await ask();
    }
    history.push({ role: "assistant", content: acc }); save();
    if (speak) say(acc);
  } catch (err) {
    out.textContent = "El iPhone pausó la IA. Reiniciando la app, tu mensaje te espera…"; failReload();
  }
  busy = false;
};

let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 20000 && !busy) { try { localStorage.setItem("dn-draft", q.value); } catch (e) {} location.reload(); }
});
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
$("clear").onclick = () => { history = []; try { localStorage.removeItem("dn-history"); } catch (e) {} chat.innerHTML = ""; add("Hola, soy DarkNova AI, creada por Saúl Arce. ¿En qué te ayudo?", "a"); };
</script>
